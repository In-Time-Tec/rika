id: no-rivet-imports
language: TypeScript
severity: error
message: Rivet imports belong only in the hosted actor adapter and its Engine process fixture.
rule:
  kind: string_fragment
  regex: "^(@rivetkit/|rivetkit$)"
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "**/dist/**"
  - "node_modules/**"
  - "apps/api/src/runtime/rivet-actor.ts"
  - "apps/api/test/fixtures/rivet-engine.ts"
