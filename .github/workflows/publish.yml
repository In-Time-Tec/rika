name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing to npm or GitHub
        required: true
        type: boolean
        default: true
      skip_ci_gate:
        description: Override failed CI for this tag (records the actor and commit)
        required: true
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify-ci
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify tag and require green CI
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.skip_ci_gate }}
        run: |
          set -euo pipefail
          # Branch dispatches validate artifacts only; they never publish.
          [[ "$GITHUB_REF" == refs/tags/* ]] || exit 0
          version="$(python3 -c 'import json; print(json.load(open("apps/rika/package.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          run_id=""
          for attempt in {1..10}; do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0].id // empty')"
            [ -z "$run_id" ] || break
            sleep 20
          done
          [ -n "$run_id" ] || { echo "::error::No CI run exists for $GITHUB_SHA"; exit 1; }
          passed=true
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status || passed=false
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --jq '.jobs[] | select(.conclusion == "success") | .name')"
          for job in quality tui proc; do
            printf '%s\n' "$jobs" | grep -Fxq "$job" || passed=false
          done
          if [ "$passed" = true ]; then
            echo "CI passed for $GITHUB_SHA (run $run_id)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${OVERRIDE:-false}" = true ]; then
            echo "::warning::CI overridden by $GITHUB_ACTOR for $GITHUB_SHA"
            echo "CI overridden by **$GITHUB_ACTOR** for $GITHUB_SHA (run $run_id)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::CI must pass quality, tui, and proc. Retry CI, or explicitly dispatch this tag with skip_ci_gate."
            exit 1
          fi

  package:
    name: package-${{ matrix.target }}
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
            os: Darwin
            architecture: arm64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: linux-arm64
            os: Linux
            architecture: aarch64
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: linux-x64
            os: Linux
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ENV: /dev/null
      BASH_ENV: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Package native target
        id: package
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$EXPECTED_OS"
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          if [ "$EXPECTED_OS" = Darwin ]; then
            test "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" = 0
          fi
          (cd apps/rika && bun -e "require.resolve('@opentui/core-$TARGET/package.json')")
          bun run package --target "$TARGET"
          version="$(bun -e 'console.log((await Bun.file("apps/rika/package.json").json()).version)')"
          archive="artifacts/rika-$version-$TARGET.tar.gz"
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Verify inventory, architecture, version, and help
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          home="$(mktemp -d)"
          trap 'rm -rf "$directory" "$home"' EXIT
          root="$(basename "$ARCHIVE" .tar.gz)"
          entries="$(tar -tzf "$ARCHIVE" | LC_ALL=C sort)"
          expected="$(ROOT="$root" bun -e 'import { packageBinEntries } from "./scripts/packaging/package-contract"; const root = process.env.ROOT; console.log([`${root}/`, `${root}/INSTALL`, `${root}/bin/`, ...packageBinEntries.map((entry) => `${root}/bin/${entry}`)].sort().join("\n"))')"
          test "$entries" = "$expected"
          tar -xzf "$ARCHIVE" -C "$directory"
          binary="$directory/$root/bin/rika"
          test -x "$binary"
          case "$EXPECTED_ARCHITECTURE" in
            x86_64) file "$binary" | grep -Eq 'x86[-_ ]64|x86_64' ;;
            arm64|aarch64) file "$binary" | grep -Eq 'arm64|aarch64|ARM aarch64' ;;
          esac
          version="$(bun -e 'console.log((await Bun.file("apps/rika/package.json").json()).version)')"
          test "$(env -i HOME="$home" PATH="$PATH" TERM=dumb "$binary" --version)" = "rika v$version"
          help="$(env -i HOME="$home" PATH="$PATH" TERM=dumb "$binary" --help)"
          printf '%s\n' "$help" | grep -Fqi rika
          if printf '%s\n' "$help" | grep -Fqi relay; then
            echo "obsolete relay command found in release help" >&2
            exit 1
          fi
      - name: Attest archive
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rika-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          compression-level: 0
          if-no-files-found: error

  release:
    name: assemble-and-publish
    needs: package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rika-*
          path: artifacts
          merge-multiple: true
      - name: Verify producer attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in artifacts/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
      - name: Assemble checksums, evidence, and npm packages
        run: bun run package --aggregate
      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Attest release metadata
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |-
            artifacts/SHA256SUMS
            artifacts/release-evidence.json
      - name: Pack and verify npm packages
        run: |
          set -euo pipefail
          for directory in artifacts/npm/*/; do
            (cd "$directory" && npm pack)
          done
          test "$(find artifacts/npm -name '*.tgz' | wc -l)" -eq 4
          for archive in artifacts/npm/cli-*/*.tgz; do
            entries="$(tar -tzf "$archive")"
            while IFS= read -r required; do
              printf '%s\n' "$entries" | grep -Fxq "$required"
            done < <(bun -e 'import { packageBinEntries } from "./scripts/packaging/package-contract"; for (const entry of packageBinEntries) console.log(`package/bin/${entry}`)')
          done
      - name: Validate npm publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for archive in artifacts/npm/cli-*/*.tgz artifacts/npm/cli/*.tgz; do
            npm publish --access public --dry-run "$archive"
          done
      - name: Upload assembled release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |-
            artifacts/SHA256SUMS
            artifacts/release-evidence.json
            artifacts/npm/*/*.tgz
          if-no-files-found: error
      - name: Publish npm platforms, then launcher
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for archive in artifacts/npm/cli-*/*.tgz artifacts/npm/cli/*.tgz; do
            npm publish --access public "$archive"
          done
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS artifacts/release-evidence.json --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 5
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
