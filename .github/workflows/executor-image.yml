name: executor-image

on:
  workflow_dispatch:
    inputs:
      generation:
        description: New immutable executor image generation
        required: true
        type: number
      promote:
        description: Publish the image and create the E2B template build
        required: true
        default: false
        type: boolean
      resume_run_id:
        description: Failed promotion run whose exact published image should resume at E2B
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: executor-image-g${{ inputs.generation }}
  cancel-in-progress: false

jobs:
  review:
    if: inputs.resume_run_id == ''
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.identity.outputs.image }}
      manifest-sha256: ${{ steps.identity.outputs.manifest-sha256 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record deterministic source identity
        id: identity
        run: |
          set -euo pipefail
          test "${{ inputs.generation }}" -gt 0
          if [ "${{ inputs.promote }}" = true ]; then test "$GITHUB_REF" = refs/heads/main; fi
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/rika-executor-g${{ inputs.generation }}"
          manifest_sha256="$(sha256sum infra/e2b/executor-v1/tool-manifest.json | cut -d' ' -f1)"
          source_date_epoch="$(git show --no-patch --format=%ct "$GITHUB_SHA")"
          test "${#manifest_sha256}" -eq 64
          test "$source_date_epoch" -gt 0
          {
            echo "IMAGE=$image"
            echo "MANIFEST_SHA256=$manifest_sha256"
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
          } >> "$GITHUB_ENV"
          {
            echo "image=$image"
            echo "manifest-sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build deterministic OCI candidate
        id: image
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "dev.rika.executor.manifest.sha256=$MANIFEST_SHA256" \
            --file infra/e2b/executor-v1/e2b.Dockerfile \
            --output "type=oci,dest=executor-image.oci.tar,rewrite-timestamp=true" \
            --metadata-file executor-image-metadata.json \
            .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' executor-image-metadata.json)"
          archive_digest="$(tar -xOf executor-image.oci.tar index.json | jq -er '.manifests | select(length == 1) | .[0].digest')"
          test "$archive_digest" = "$digest"
          echo "digest=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        env:
          SYFT_SOURCE_NAME: ${{ env.IMAGE }}
          SYFT_SOURCE_VERSION: ${{ env.digest }}
          SYFT_FORMAT_PRETTY: "false"
        with:
          image: oci-archive:executor-image.oci.tar
          format: spdx-json
          syft-version: v1.33.0
          output-file: executor-sbom.raw.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Normalize SPDX deterministically
        run: |
          set -euo pipefail
          created="$(date -u --date="@$SOURCE_DATE_EPOCH" '+%Y-%m-%dT%H:%M:%SZ')"
          namespace="https://github.com/$GITHUB_REPOSITORY/sbom/${digest#sha256:}"
          jq -S -c \
            --arg created "$created" \
            --arg namespace "$namespace" \
            '.creationInfo.created = $created | .documentNamespace = $namespace' \
            executor-sbom.raw.spdx.json > executor-sbom.spdx.json
          rm executor-sbom.raw.spdx.json
      - name: Extract OCI candidate for vulnerability scan
        run: |
          set -euo pipefail
          mkdir executor-image.oci
          tar -xf executor-image.oci.tar -C executor-image.oci
          test "$(jq -er '.manifests | select(length == 1) | .[0].digest' executor-image.oci/index.json)" = "$digest"
      - name: Scan candidate vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          input: executor-image.oci
          scanners: vuln
          vuln-type: os,library
          format: json
          output: executor-vulnerability-scan.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
      - name: Record candidate identity
        run: |
          set -euo pipefail
          sbom_sha256="$(sha256sum executor-sbom.spdx.json | cut -d' ' -f1)"
          scan_sha256="$(sha256sum executor-vulnerability-scan.json | cut -d' ' -f1)"
          jq -S -n \
            --arg image "$IMAGE" \
            --arg imageDigest "$digest" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg sourceDateEpoch "$SOURCE_DATE_EPOCH" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg sbomSha256 "$sbom_sha256" \
            --arg vulnerabilityScanSha256 "$scan_sha256" \
            --arg generation "${{ inputs.generation }}" \
            '{schemaVersion:1,generation:($generation|tonumber),sourceCommit:$sourceCommit,sourceDateEpoch:($sourceDateEpoch|tonumber),image:$image,imageDigest:$imageDigest,dockerfile:"infra/e2b/executor-v1/e2b.Dockerfile",manifest:{path:"infra/e2b/executor-v1/tool-manifest.json",sha256:$manifestSha256},sbom:{path:"executor-sbom.spdx.json",format:"spdx-json",sha256:$sbomSha256},vulnerabilityScan:{path:"executor-vulnerability-scan.json",scanner:"trivy-v0.70.0",sha256:$vulnerabilityScanSha256,policy:{blockingSeverities:["HIGH","CRITICAL"],requiresFixedVersion:true}}}' \
            > executor-build.json
      - name: Attest review build record
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: executor-build.json
      - name: Upload retained review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: executor-g${{ inputs.generation }}-${{ github.sha }}-evidence
          path: |-
            executor-build.json
            executor-sbom.spdx.json
            executor-vulnerability-scan.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce vulnerability policy
        run: |
          set -euo pipefail
          blocking="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' executor-vulnerability-scan.json)"
          echo "Fixable HIGH or CRITICAL vulnerabilities: $blocking"
          test "$blocking" -eq 0
      - name: Upload private promotion handoff
        if: inputs.promote == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: executor-g${{ inputs.generation }}-${{ github.sha }}-oci
          path: executor-image.oci.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    if: inputs.promote == true && inputs.resume_run_id == ''
    needs: review
    environment: executor-production
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      IMAGE: ${{ needs.review.outputs.image }}
      digest: ${{ needs.review.outputs.digest }}
      MANIFEST_SHA256: ${{ needs.review.outputs.manifest-sha256 }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: executor-g${{ inputs.generation }}-${{ github.sha }}-evidence
      - name: Download exact OCI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: executor-g${{ inputs.generation }}-${{ github.sha }}-oci
      - name: Verify approved review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -er '.generation' executor-build.json)" -eq "${{ inputs.generation }}"
          test "$(jq -er '.sourceCommit' executor-build.json)" = "$GITHUB_SHA"
          test "$(jq -er '.image' executor-build.json)" = "$IMAGE"
          test "$(jq -er '.imageDigest' executor-build.json)" = "$digest"
          test "$(jq -er '.manifest.sha256' executor-build.json)" = "$MANIFEST_SHA256"
          test "$(sha256sum infra/e2b/executor-v1/tool-manifest.json | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(tar -xOf executor-image.oci.tar index.json | jq -er '.manifests | select(length == 1) | .[0].digest')" = "$digest"
          test "$(sha256sum executor-sbom.spdx.json | cut -d' ' -f1)" = "$(jq -er '.sbom.sha256' executor-build.json)"
          test "$(sha256sum executor-vulnerability-scan.json | cut -d' ' -f1)" = "$(jq -er '.vulnerabilityScan.sha256' executor-build.json)"
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' executor-vulnerability-scan.json)" -eq 0
          gh attestation verify executor-build.json --repo "$GITHUB_REPOSITORY"
      - name: Require a fresh generation package
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          owner_path="orgs"
          test "$OWNER_TYPE" = Organization || owner_path="users"
          package="rika-executor-g${{ inputs.generation }}"
          if gh api "/$owner_path/${{ github.repository_owner }}/packages/container/$package/versions?per_page=1" > existing-versions.json 2> package-query-error.txt; then
            test "$(jq 'length' existing-versions.json)" -eq 0
          else
            grep -q 'HTTP 404' package-query-error.txt
          fi
          rm -f existing-versions.json package-query-error.txt
      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Upload immutable digest without a tag
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$HOME/.docker:/root/.docker:ro" \
            quay.io/skopeo/stable@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4 \
            copy --preserve-digests --authfile /root/.docker/config.json \
            oci-archive:/workspace/executor-image.oci.tar "docker://$IMAGE@$digest"
      - name: Attest exact image provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.digest }}
          push-to-registry: true
      - name: Attest executor build identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.digest }}
          predicate-type: https://github.com/${{ github.repository }}/attestations/executor-image/v1
          predicate-path: executor-build.json
          push-to-registry: true
      - name: Verify published image attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="oci://$IMAGE@$digest"
          gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" --predicate-type "https://slsa.dev/provenance/v1" --bundle-from-oci
          gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" --predicate-type "https://github.com/$GITHUB_REPOSITORY/attestations/executor-image/v1" --bundle-from-oci

  resume:
    if: inputs.promote == true && inputs.resume_run_id != ''
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.evidence.outputs.digest }}
      image: ${{ steps.evidence.outputs.image }}
      manifest-sha256: ${{ steps.evidence.outputs.manifest-sha256 }}
      source-commit: ${{ steps.run.outputs.source-commit }}
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Checkout recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify failed promotion run identity
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          case "$RESUME_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" > resume-run.json
          test "$(jq -er '.repository.full_name' resume-run.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.path' resume-run.json)" = ".github/workflows/executor-image.yml"
          test "$(jq -er '.event' resume-run.json)" = workflow_dispatch
          test "$(jq -er '.head_branch' resume-run.json)" = main
          test "$(jq -er '.status' resume-run.json)" = completed
          test "$(jq -er '.conclusion' resume-run.json)" = failure
          source_commit="$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' resume-run.json)"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/jobs?per_page=100" > resume-jobs.json
          test "$(jq -er '.total_count' resume-jobs.json)" -lt 100
          jq -e 'any(.jobs[]; .name == "review" and .conclusion == "success")' resume-jobs.json
          jq -e 'any(.jobs[]; .name == "promote" and .conclusion == "failure")' resume-jobs.json
          for step in \
            "Upload immutable digest without a tag" \
            "Attest exact image provenance" \
            "Attest executor build identity" \
            "Verify image attestations before publication"
          do
            jq -e --arg step "$step" 'any(.jobs[] | select(.name == "promote") | .steps[]; .name == $step and .conclusion == "success")' resume-jobs.json
          done
          jq -e 'any(.jobs[] | select(.name == "promote") | .steps[]; .name == "Create and smoke immutable E2B build" and .conclusion == "skipped")' resume-jobs.json
          echo "source-commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Download retained review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: executor-g${{ inputs.generation }}-${{ steps.run.outputs.source-commit }}-evidence
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained review evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.run.outputs.source-commit }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          expected_image="ghcr.io/$owner/rika-executor-g${{ inputs.generation }}"
          test "$(jq -er '.generation' executor-build.json)" -eq "${{ inputs.generation }}"
          test "$(jq -er '.sourceCommit' executor-build.json)" = "$SOURCE_COMMIT"
          test "$(jq -er '.image' executor-build.json)" = "$expected_image"
          digest="$(jq -er '.imageDigest | select(test("^sha256:[a-f0-9]{64}$"))' executor-build.json)"
          manifest_sha256="$(jq -er '.manifest.sha256 | select(test("^[a-f0-9]{64}$"))' executor-build.json)"
          test "$(sha256sum infra/e2b/executor-v1/tool-manifest.json | cut -d' ' -f1)" = "$manifest_sha256"
          test "$(sha256sum executor-sbom.spdx.json | cut -d' ' -f1)" = "$(jq -er '.sbom.sha256' executor-build.json)"
          test "$(sha256sum executor-vulnerability-scan.json | cut -d' ' -f1)" = "$(jq -er '.vulnerabilityScan.sha256' executor-build.json)"
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' executor-vulnerability-scan.json)" -eq 0
          gh attestation verify executor-build.json --repo "$GITHUB_REPOSITORY"
          {
            echo "image=$expected_image"
            echo "digest=$digest"
            echo "manifest-sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Authenticate to private GHCR image
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify exact published image and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.evidence.outputs.image }}
          digest: ${{ steps.evidence.outputs.digest }}
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE@$digest" > /dev/null
          subject="oci://$IMAGE@$digest"
          gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" --predicate-type "https://slsa.dev/provenance/v1" --bundle-from-oci
          gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" --predicate-type "https://github.com/$GITHUB_REPOSITORY/attestations/executor-image/v1" --bundle-from-oci

  template:
    if: >-
      always() && inputs.promote == true &&
      ((inputs.resume_run_id == '' && needs.publish.result == 'success') ||
      (inputs.resume_run_id != '' && needs.resume.result == 'success'))
    needs: [review, publish, resume]
    environment: executor-production
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      IMAGE: ${{ needs.resume.outputs.image || needs.review.outputs.image }}
      digest: ${{ needs.resume.outputs.digest || needs.review.outputs.digest }}
      MANIFEST_SHA256: ${{ needs.resume.outputs.manifest-sha256 || needs.review.outputs.manifest-sha256 }}
      SOURCE_COMMIT: ${{ needs.resume.outputs.source-commit || github.sha }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require template credentials
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          GHCR_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$E2B_API_KEY"
          test -n "$GHCR_PASSWORD"
      - name: Create and smoke immutable E2B build
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          template_alias="rika-executor-v1-g${{ inputs.generation }}"
          bun run packages/e2b-executor/scripts/create-image-template.ts "$IMAGE@$digest" "$template_alias"
          template_id="$(jq -er '.templateId | select(length > 0)' executor-template.json)"
          build_id="$(jq -er '.buildId | select(length > 0)' executor-template.json)"
          test "$template_id" != "$build_id"
          bun run packages/e2b-executor/scripts/image-smoke.ts "$template_id" "$build_id" "$MANIFEST_SHA256"
          jq -S -n \
            --arg buildId "$build_id" \
            --arg templateId "$template_id" \
            --arg templateAlias "$template_alias" \
            --arg image "$IMAGE" \
            --arg imageDigest "$digest" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg generation "${{ inputs.generation }}" \
            '{schemaVersion:1,generation:($generation|tonumber),sourceCommit:$sourceCommit,image:$image,imageDigest:$imageDigest,manifestSha256:$manifestSha256,e2bTemplateAlias:$templateAlias,e2bTemplateId:$templateId,e2bBuildId:$buildId}' \
            > executor-promotion.json
          cat executor-promotion.json >> "$GITHUB_STEP_SUMMARY"
      - name: Attest promoted template identity
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: executor-promotion.json
      - name: Retain promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: executor-g${{ inputs.generation }}-${{ env.SOURCE_COMMIT }}-promotion
          path: |-
            executor-promotion.json
            executor-smoke.json
            executor-template.json
          if-no-files-found: error
          retention-days: 90
